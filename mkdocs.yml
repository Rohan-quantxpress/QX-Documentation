  - Home: index.md
  - Strategy JSON:
      - Overview: strategy-json/index.md
  - Strategy Data Management:
      - Strategy Data Management:
          - Introduction: strategy-data/strategy-data-management/index.md
          - Database to JSON: strategy-data/strategy-data-management/database-to-json.md
          - JSON to Strategies: strategy-data/strategy-data-management/json-to-strategies.md
          - JSON to Signal Strategies: strategy-data/strategy-data-management/json-to-signal-strategies.md
  - Basket Trading:
