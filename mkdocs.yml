
site_name: QX Documentation
site_description: Unified QX / Blitz Trader documentation
copyright: © QuantXpress

theme:
  name: material
  font:
    text: Outfit
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji

extra_css:
  - stylesheets/extra.css
  - blitz-api/css/custom.css
  - strategy-json/styles/extra.css
  - strategy-data/stylesheets/extra.css
  - basket-trading/stylesheets/extra.css
  - bod-eod/docs.css
  - system-report/stylesheets/extra.css

